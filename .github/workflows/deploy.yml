name: CI and Deploy to GitHub Pages

on:
  push:
    branches: [ master ] # 또는 사용 중인 기본 브랜치명 (예: master)

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 실행 시 이전 빌드 취소
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies (Frontend & Backend)
        run: npm run setup

      # [CI 단계] 프론트엔드 타입/린트 체크 및 테스트 실행
      - name: Run Checks and Tests
        run: |
          npm run check
          npm run test:explore
          npm run test:search

      # [Build 단계] 프론트엔드 정적 파일 빌드
      - name: Build Frontend
        run: npm run build

      # GitHub Pages용 업로드 환경 설정 (Vite, Webpack 등의 빌드 결과물 폴더 지정)
      # 보통 frontend/dist 또는 frontend/build에 생성됩니다. 프로젝트에 맞게 path를 수정하세요.
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist' 

      # [CD 단계] 배포 실행
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
